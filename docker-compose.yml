version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: pulse-mongodb
    ports:
      - "27017:27017"
    volumes:
      - pulse-db-data:/data/db
    networks:
      - pulse-network

  backend:
    build: ./backend
    container_name: pulse-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/pulse_analytics
      - JWT_SECRET=pulse_analytics_jwt_super_secret_key_13579
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb
    networks:
      - pulse-network

  frontend:
    build: ./frontend
    container_name: pulse-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - pulse-network

volumes:
  pulse-db-data:

networks:
  pulse-network:
    driver: bridge
